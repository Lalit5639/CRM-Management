<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Open the Phoenix Business Suite CRM application.">
  <title>Phoenix Business Suite</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #172033;
      background: #f3f6fb;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
    }

    main {
      width: min(90%, 34rem);
      padding: 3rem 2rem;
      border: 1px solid #e1e7f0;
      border-radius: 1rem;
      background: #fff;
      box-shadow: 0 1rem 3rem rgb(23 32 51 / 8%);
      text-align: center;
    }

    h1 {
      margin: 0 0 0.75rem;
    }

    p {
      color: #596579;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.8rem 1.25rem;
      border-radius: 0.5rem;
      background: #2563eb;
      color: #fff;
      font-weight: 600;
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <main>
    <h1>Phoenix Business Suite</h1>
    <p>CRM and business operations in one workspace.</p>
    <a href="./frontend/index.html">Open the app</a>
  </main>
</body>
</html>
